  - https://docs.globalgetnet.com/en/products/agentic-commerce/mcp-ai-toolkit
  - https://github.com/Getnet-Brasil
  - https://site.getnet.com.br
  updated: '2026-05-25'

- type: UseCases
  data:
  - Accept Pix, card, and Boleto on a Brazilian e-commerce checkout via Web Checkout iframe
  - Build a fully customized PCI-compliant card flow with installments using the Regional API
  - Operate a multi-seller marketplace with automatic commission splits and daily CIP settlement
  - Sell on WhatsApp / SMS / email by minting Payment Links programmatically
  - Self-serve new merchants onto Getnet Brasil via the Onboarding API in a single online flow
  - Manage cross-country card disputes through the unified Chargeback API
  - Drive Get Smart terminals from a third-party PDV or ERP using Integrated POS or Host-to-Host
  - Run cloud-orchestrated POS flows with Cloud-to-Cloud for omnichannel pickup
  - Reconcile multi-country settlement with the Merchant Reporting API
  - Expose Getnet payments to autonomous AI agents through the Agentic Commerce + MCP toolkit
  - Embed Getnet payments into Magento 2, WooCommerce, VTEX, or Nubemshop stores
  - Tokenize cards once and reuse for recurring and one-click transactions
  - Authenticate high-risk card transactions with 3DS on the Regional API
  sources:
  - https://docs.globalgetnet.com/en
  - https://github.com/Getnet-Brasil/payment-magento

- type: Integrations
  data:
  - Banco Santander (parent group; banking, settlement, FX, Pix Santander)
  - PagoNxt (Santander's payments platform org)
  - SAP (SAP Immediate Delivery white-label APIs)
  - Magento 2 / Adobe Commerce (official Getnet-Brasil plugin)
  - WooCommerce (official plugin via Getnet Docs)
  - VTEX (official plugin via Getnet Docs)
  - Tiendanube / Nubemshop (official plugin via Getnet Docs)
  - Visa, Mastercard, Elo, American Express, Hipercard, Diners (card schemes)
  - Pix (Banco Central do Brasil instant payment scheme via Santander)
  - Bizum (Spain instant payments)
  - CIP (Brazilian interbank settlement, marketplace daily file transmission)
  - Model Context Protocol (MCP) for AI assistants
  sources:
  - https://docs.globalgetnet.com/en
  - https://github.com/Getnet-Brasil
  - https://www.santander.com/en/press-room/specials/santander-global-businesses/santanders-global-payments-business

- type: Solutions
  data:
  - Online Payments (Regional API, Web Checkout, Marketplace, Payment Link)
  - In-Store Payments (Get Smart, SuperGet, Get Classica, POS Digital, App2App, Host-to-Host, Integrated POS, Cloud-to-Cloud)
  - Business Operations (Onboarding, Chargeback, Merchant Reporting)
  - Agentic Commerce (Agentic Commerce API + MCP AI Toolkit)
  - Local Processor Spain (Get Smart App2App)
  - White Label Merchant Ops (Paper Rolls, Fee Merchant)
  - SAP Immediate Delivery (Inventory, Closure, Upload Evidence, Webhooks)
