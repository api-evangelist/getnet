- type: Features
  data:
  - Single Entry Point (SEP) Regional API across BR, AR, CL, CO, MX, UY, PT, ES
  - Web Checkout in three modes (iframe, lightbox, redirect)
  - Marketplace Capture API with programmable split rules and CIP settlement files
  - Payment Link API for Brazilian no-code commerce
  - Onboarding API for 100%-online merchant self-accreditation in Brazil
  - Chargeback API with OAuth 2.0 and merchant / platform / auditor roles
  - Merchant Reporting API for unified multi-country reconciliation
  - In-store integrations: App2App, Host-to-Host, Integrated POS, Cloud-to-Cloud
  - Terminal family: Get Smart, SuperGet, Get Classica, POS Digital
  - Pix (Brazil), Boleto Bancario, credit, debit, 3DS, tokenization, installments
  - Bizum support in Spain via local processor
  - Recurring payments, one-click payments, two-step pre-authorization and capture
  - SAP-integrated entrega imediata APIs (inventory, closure, evidence, webhooks)
  - White-label merchant operations (paper rolls, fee merchant) for partners
  - Agentic Commerce surface plus MCP AI Toolkit for ChatGPT / Claude / Gemini
  - Plugins for WooCommerce, Magento, VTEX, and Tiendanube / Nubemshop
  - Open-source Magento 2 module (payment-magento) maintained by Getnet-Brasil
  - Sandbox / homologacao environment at api-homologacao.getnet.com.br
  sources:
  - https://docs.globalgetnet.com/en
  - https://docs.globalgetnet.com/en/products/online-payments/regional-api
  - https://docs.globalgetnet.com/en/products/online-payments/web-checkout
