  description: >-
    Getnet's core REST API and Single Entry Point (SEP) for direct payment
    integration across Argentina, Brazil, Chile, Colombia, Mexico, Portugal,
    Spain, and Uruguay. One contract gives merchants omnichannel payment
    services across e-commerce and card-present flows, including single-step
    authorize-and-capture, two-step pre-authorization and capture, 3D Secure
    authentication, refund, cancel, query, recurring payments, one-click
    payments, installments (Parcelado Emissor and Parcelado Lojista in
    Brazil), Pix in Brazil, Bizum in Spain, digital wallets, and a long tail
    of country-specific alternative payment methods.

