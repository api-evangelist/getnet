description: >-
  Getnet is a leading merchant acquirer in Latin America and a payments
  subsidiary of Banco Santander, operating across Brazil, Argentina, Chile,
  Colombia, Mexico, Uruguay, Spain, and Portugal. Getnet is positioned as the
  region's second-largest acquirer by transaction volume and powers card
  processing, alternative payment methods, gateway, anti-fraud, tokenization,
  installments, marketplaces, and POS for over a million merchants. Its API
  ecosystem is now consolidated under the global Getnet Docs portal
  (docs.globalgetnet.com) with a Single Entry Point (SEP) Regional API
  alongside Web Checkout, Marketplace, Payment Link, Chargeback, Onboarding,
  in-store terminal integrations (App2App, Host-to-Host, Integrated POS,
  Cloud-to-Cloud), and an emerging Agentic Commerce / MCP AI Toolkit surface
  for AI-driven payments. The Brazilian developer hub at
  developers.getnet.com.br is being migrated to the unified global portal.
